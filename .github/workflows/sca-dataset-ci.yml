name: build-and-test
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (eslint + tsc)
        run: npm run build
      - name: Test
        run: npm test
        env:
          CI: 'true'
